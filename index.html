<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Hero</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
    body { background:#0d0e11; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }

    .box { width:100%; max-width:1050px; background:#141518; border-radius:24px; border:1px solid #23252a; padding:30px 50px 50px; }
    
    /* Nav */
    nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; }
    .logo { color:#f36805; font-size:22px; font-weight:800; text-decoration:none; }
    .links a { color:#888; text-decoration:none; margin:14px; font-size:14px; }
    .links a.active, .links a:hover { color:#f36805; }
    
    /* Buttons */
    .btn { background:#f36805; color:#fff; padding:10px 22px; font-size:13px; cursor:pointer; text-decoration:none; }
    .btn-outline { color:#bbb; }

    /* Hero */
    .hero { display:flex; align-items:center; justify-content:space-between; gap:40px; }
    .sub { color:#777; font-size:14px; margin-bottom:4px; }
    .name { color:#fff; font-size:22px; margin-bottom:8px; }
    h1 { color:#f36805; font-size:46px; margin-bottom:20px; }

    .socials { display:flex; gap:10px; margin-bottom:24px; }
    .socials a { width:32px; height:32px; border-radius:50%; background:#1c1d22; color:#888; display:flex; align-items:center; justify-content:center; font-size:13px; text-decoration:none; border:1px solid #2a2c33; }

    .actions {gap:12px; margin-bottom:36px; }

    /* Stats */
    .stats { display:inline-flex; background:#1a1b20; padding:14px 22px; border-radius:12px; gap:20px; border:1px solid #252730; }
    .stat { text-align:left; border-right:1px solid #2a2c33; padding-right:20px; }
    .stat:last-child { border:none; padding-right:0; }
    .stat b { display:block; color:#f36805; font-size:18px; }
    .stat span { color:#777; font-size:11px; }

    /* Image */
    .img-wrap { position:relative; width:340px; height:340px; align-items:center; }
    .circle { position:absolute; width:320px; height:320px; background:#1e2026; border-radius:50%; }
    .img-wrap img { position:relative; width:100%; height:100%; border-radius:50%;}
  </style>
</head>
<body>

  <div class="box">
    <nav>
      <a href="#" class="logo">My Portfolio</a>
      <div class="links">
        <a href="#" class="active">Home</a>
        <a href="#">Services</a>
        <a href="#">About me</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact me</a>
      </div>
      <a href="#" class="btn">Hire Me</a>
    </nav>

    <div class="hero">
      <div>
        <p class="sub">Hi I am</p>
        <h2 class="name">Saad iqbal</h2>
        <h1>UI/UX designer</h1>

        <div class="socials">
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="#"><i class="fa-brands fa-dribbble"></i></a>
          <a href="#"><i class="fa-brands fa-behance"></i></a>
        </div>

        <div class="actions">
          <a href="#" class="btn">Hire Me</a>
          <a href="#" class="btn btn-outline">Download CV</a>
        </div>

        <div class="stats">
          <div class="stat"><b>5+</b><span>Experiences</span></div>
          <div class="stat"><b>20+</b><span>Project done</span></div>
          <div class="stat"><b>80+</b><span>Happy Clients</span></div>
        </div>
      </div>

      <div class="img-wrap">
        <div class="circle"></div>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSNupSKjnCIs8Z8mbmI3Nm1Huhj_wEEm-BQo522KiZjAg&s=10" alt="Profile">
      </div>
    </div>
  </div>

</body>
</html>
